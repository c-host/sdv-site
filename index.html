<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDV - Artist Profile</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/presentation-boot.js"></script>
</head>

<body>
  <section class="view view--home">
    <div class="home-sdv-mark" aria-hidden="true">SDV</div>
    <div class="home-material-filter" id="home-material-filter" aria-label="Materials" aria-live="polite"></div>
    <button type="button" class="home-info-btn" id="home-info-btn" aria-expanded="false" aria-controls="home-info-panel">
      INFO
    </button>
    <div class="home-line home-line--vertical" aria-hidden="true"></div>
    <div class="home-line home-line--horizontal" aria-hidden="true"></div>
    <div class="home-name-stacey" aria-hidden="true">STACEY</div>
    <div class="home-name-devoe" aria-hidden="true">DE VOE</div>
    <aside class="home-info-panel" id="home-info-panel" aria-hidden="true">
      <div class="home-info-scroll" id="home-info-content"></div>
    </aside>
    <div class="home-main">
      <nav class="home-projects" aria-label="Projects"></nav>
    </div>
  </section>
  <script src="js/sdv-shared.js"></script>
  <script src="js/content-loader.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
