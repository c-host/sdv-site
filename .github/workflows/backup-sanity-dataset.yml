name: Backup Sanity dataset

on:
  workflow_dispatch:
    inputs:
      include_assets:
        description: 'Include assets (images/files) in the backup'
        required: false
        default: 'false'
  schedule:
    # Nightly doc-only backup
    - cron: '25 2 * * *'
    # Weekly full backup (includes assets)
    - cron: '45 3 * * 0'

permissions:
  contents: read

concurrency:
  group: sanity-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Prepare Sanity token
        env:
          RAW_SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Secrets pasted into GitHub often include a trailing newline, which breaks Authorization headers.
          TOKEN="$(printf '%s' "${RAW_SANITY_AUTH_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$TOKEN" ]; then
            echo "::error::SANITY_AUTH_TOKEN secret is missing or empty."
            exit 1
          fi
          if printf '%s' "$TOKEN" | grep -q $'[\r\n]'; then
            echo "::error::SANITY_AUTH_TOKEN still contains newline characters after sanitizing."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "SANITY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sanity-studio/package-lock.json

      - name: Install Studio dependencies
        working-directory: sanity-studio
        run: npm ci

      - name: Resolve backup options
        id: opts
        run: |
          set -euo pipefail
          INCLUDE_ASSETS="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INCLUDE_ASSETS="${{ inputs.include_assets }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "45 3 * * 0" ]; then
              INCLUDE_ASSETS="true"
            fi
          fi
          echo "include_assets=$INCLUDE_ASSETS" >> "$GITHUB_OUTPUT"

      - name: Export dataset
        id: export
        working-directory: sanity-studio
        run: |
          set -euo pipefail
          if [ -z "${SANITY_AUTH_TOKEN:-}" ]; then
            echo "Missing SANITY_AUTH_TOKEN secret."
            exit 1
          fi

          mkdir -p ../backups
          STAMP="$(date -u +'%Y%m%d-%H%M%S')"
          DATASET="production"
          OUT="../backups/sanity-${DATASET}-${STAMP}.tar.gz"

          ARGS=(dataset export "$DATASET" "$OUT")
          if [ "${{ steps.opts.outputs.include_assets }}" = "true" ]; then
            ARGS+=(--assets)
          fi

          echo "Running: npx sanity ${ARGS[*]}"
          npx sanity "${ARGS[@]}"

          echo "backup_file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanity-backup-${{ github.run_id }}
          path: backups/*.tar.gz
          if-no-files-found: error
          retention-days: 30
