# Sync project/ and immersive/ HTML shells from Sanity, then commit to this repo.
#
# Triggers (no scheduled polling — avoids unnecessary Sanity API calls):
#   - Manual: GitHub → Actions → "Sync Sanity pages" → Run workflow
#   - Optional: Sanity webhook → repository_dispatch (fires only when content changes)
#
# One-time Sanity webhook setup (optional — sanity.io/manage → API → Webhooks):
#   URL:    https://api.github.com/repos/OWNER/REPO/dispatches
#   Method: POST
#   Headers:
#     Accept: application/vnd.github+json
#     Authorization: Bearer <GITHUB_PAT>
#     X-GitHub-Api-Version: 2022-11-28
#   Body:   {"event_type":"sanity-sync"}
#   Filter: _type == "project" || _type == "homePage"
#   Dataset: production
#
# GitHub PAT needs "Contents: Read and write" on this repo.
# Store the PAT only in Sanity webhook headers (not in this repo).

name: Sync Sanity pages

on:
  repository_dispatch:
    types: [sanity-sync]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sanity-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync pages from Sanity
        run: npm run sync:pages:ci

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/ immersive/
          if git diff --staged --quiet; then
            echo "No page changes to commit."
            exit 0
          fi
          git commit -m "chore: sync project pages from Sanity"
          git push
